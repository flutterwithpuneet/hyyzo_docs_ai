name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Python Backend & Streamlit Testing & Linting
  # -------------------------------------------------------------
  python-ci:
    name: Python CI (v${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Code Syntax
        run: |
          python -m py_compile server.py app.py app_copilot.py main.py src/config.py src/loader.py src/engine.py

      - name: Run Pytest Test Suite
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci_testing"
        run: |
          pytest tests/ -v

  # -------------------------------------------------------------
  # Job 2: Next.js Frontend Build & Linting
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Node v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Next.js Lint
        run: npm run lint

      - name: Build Next.js Production Bundle
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Documentation Integrity Check
  # -------------------------------------------------------------
  docs-validation:
    name: Documentation Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Docs Directory Exists & Has Files
        run: |
          if [ ! -d "docs" ]; then
            echo "Error: docs directory missing"
            exit 1
          fi
          DOC_COUNT=$(find docs -type f \( -name "*.md" -o -name "*.txt" \) | wc -l)
          echo "Found $DOC_COUNT documentation files."
          if [ "$DOC_COUNT" -eq 0 ]; then
            echo "Error: No documentation files found in docs/"
            exit 1
          fi
