[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0D0F12"
secondaryBackgroundColor = "#14171D"
textColor = "#F3F4F6"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false
